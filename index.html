<!-- 3D 제품 뷰어 (three.js) — 제품 상세에서 실제 필요할 때만 지연 로딩 -->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
  let _libs = null;
  async function libs(){
    if(_libs) return _libs;
    const [THREE, stl, orb] = await Promise.all([
      import('three'),
      import('three/addons/loaders/STLLoader.js'),
      import('three/addons/controls/OrbitControls.js'),
    ]);
    _libs = { THREE, STLLoader: stl.STLLoader, OrbitControls: orb.OrbitControls };
    return _libs;
  }
  window.UB3D = {
    async mount(host, url, opts){
      opts = opts || {};
      const { THREE, STLLoader, OrbitControls } = await libs();
      const res = await fetch(url);
      if(!res.ok) throw new Error('stl ' + res.status);
      const geo = new STLLoader().parse(await res.arrayBuffer());
      geo.computeBoundingBox();
      const c = new THREE.Vector3(); geo.boundingBox.getCenter(c); geo.translate(-c.x,-c.y,-c.z);
      geo.computeVertexNormals(); geo.computeBoundingSphere();
      const R = (geo.boundingSphere && geo.boundingSphere.radius) || 1;
      const W = ()=>host.clientWidth||400, H = ()=>host.clientHeight||520;
      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(38, W()/H(), R*0.05, R*40);
      cam.position.set(R*1.3, R*0.9, R*2.4);
      const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
      renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W(),H());
      host.appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xbcd8ff,0x0a1018,0.8));
      const kl=new THREE.DirectionalLight(0xffffff,1.5); kl.position.set(1,1.4,1.2); scene.add(kl);
      const fl=new THREE.DirectionalLight(0x88bbff,0.6); fl.position.set(-1.2,0.3,-1); scene.add(fl);
      const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(opts.color||'#1a1a1a'), metalness:0.25, roughness:0.55});
      const pivot=new THREE.Group();
      const mesh=new THREE.Mesh(geo,mat); mesh.rotation.x=-Math.PI/2; pivot.add(mesh); scene.add(pivot);
      const controls=new OrbitControls(cam, renderer.domElement);
      controls.enableDamping=true; controls.autoRotate=false; controls.enablePan=false;
      const spin=(opts.spin!=null?opts.spin:0.014);   // 제품 쇼케이스 회전은 항상 동작 (요청 사항)
      let raf, alive=true;
      const ro=new ResizeObserver(()=>{cam.aspect=W()/H();cam.updateProjectionMatrix();renderer.setSize(W(),H());}); ro.observe(host);
      (function loop(){ if(!alive) return; raf=requestAnimationFrame(loop); pivot.rotation.y+=spin; controls.update(); renderer.render(scene,cam); })();
      return {
        setColor(hex){ mat.color.set(hex); },
        dispose(){ alive=false; cancelAnimationFrame(raf); ro.disconnect(); controls.dispose();
          geo.dispose(); mat.dispose(); renderer.dispose();
          if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); }
      };
    }
  };
</script>

<script>
// === 강제 캐시 박살 — 매 진입마다 옛 SW/caches 모두 제거. 무한 reload 방지. ===
(function () {
  var hasSW = 'serviceWorker' in navigator;
  var hasCaches = 'caches' in window;
  if (!hasSW && !hasCaches) return;

  var FLAG = 'ub:cleared:once';
  var alreadyCleared = false;
  try { alreadyCleared = sessionStorage.getItem(FLAG) === '1'; } catch (e) {}

  var pending = 0;
  var didSomething = false;
  function doneStep() {
    pending--;
    if (pending <= 0) {
      try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
      if (didSomething && !alreadyCleared) location.reload();
    }
  }

  if (hasSW) {
    pending++;
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      if (regs.length > 0) didSomething = true;
      return Promise.all(regs.map(function (r) { return r.unregister(); }));
    }).catch(function () {}).finally(doneStep);
  }
  if (hasCaches) {
    pending++;
    caches.keys().then(function (keys) {
      if (keys.length > 0) didSomething = true;
      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }).catch(function () {}).finally(doneStep);
  }
})();
</script>

<script>
  // React 앱이 #root에 마운트되면(= 앱 푸터가 렌더되면) 정적 푸터를 화면에서 숨겨 중복 제거.

    var root = document.getElementById("root");

    if (!root || !stat) return;
    var hide = function () { if (root.children.length) { stat.style.display = "none"; return true; } return false; };

      var obs = new MutationObserver(function () { if (hide()) obs.disconnect(); });
      obs.observe(root, { childList: true });
    }
  })();
